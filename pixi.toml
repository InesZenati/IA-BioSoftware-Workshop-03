[project]
name = "figure2A"
version = "0.1.0"
channels = ["conda-forge"]

[dependencies]
python = ">=3.10"
pandas = "*"
numpy = "*"
matplotlib = "*"
openpyxl = "*"

[feature.dev.dependencies]
ruff = "*"
pyright = "*"
pytest = "*"
pytest-cov = "*"
safety = "*"
trivy = "*"

[environments]
default = { features = ["default"] }
dev = { features = ["default", "dev"] }

[feature.dev.tasks]
lint = "ruff check ."
format = "ruff format ."
typecheck = "pyright figure2A.py"
test = "pytest"
coverage = "pytest --cov=. --cov-report=term-missing"
all-checks = { depends-on = ["lint", "typecheck", "test"] }